name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Derive NX_BASE / NX_HEAD so `nx affected` only runs what a PR touches.
      - uses: nrwl/nx-set-shas@v4

      # Playwright browsers are ~70s to download; cache them by Playwright version.
      # CI runs Chromium only (see apps/cms-admin-e2e/playwright.config.mts).
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npx nx format:check --base="remotes/origin/main"
      # Remote caching via Nx Cloud (nxCloudId in nx.json); no distributed agents.
      - run: npx nx affected -t lint test build typecheck e2e
      - run: npx nx fix-ci
        if: always()
