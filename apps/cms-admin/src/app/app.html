<header class="flex items-center justify-between border-b px-6 py-4">
  <h1 class="text-2xl font-semibold tracking-tight text-brand-primary">
    Studiohouse
  </h1>
  <button hlmBtn variant="outline" type="button" (click)="toggleDark()">
    Toggle dark mode
  </button>
</header>

<main class="mx-auto flex max-w-4xl flex-col gap-6 p-6">
  <section hlmCard>
    <div hlmCardHeader>
      <h2 hlmCardTitle>Active theme</h2>
      <p hlmCardDescription>{{ theme()?.name ?? 'None applied' }}</p>
    </div>
    <div hlmCardContent class="grid gap-3 sm:grid-cols-5">
      @for (role of roles; track role) { @let color = theme()?.colors?.[role];
      <div class="flex flex-col gap-1">
        <div
          class="h-16 rounded-md border"
          [style.background-color]="color?.hex"
        ></div>
        <span class="text-sm font-medium">{{ color?.name }}</span>
        <span class="text-muted-foreground text-xs">{{ color?.hex }}</span>
      </div>
      }
    </div>
    <div hlmCardFooter class="gap-2">
      <button hlmBtn type="button">Primary</button>
      <button hlmBtn variant="secondary" type="button">Secondary</button>
      <button hlmBtn variant="ghost" type="button">Ghost</button>
    </div>
  </section>

  <router-outlet></router-outlet>
</main>
